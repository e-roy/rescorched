name: CI

on:
  pull_request:
  push:
    branches: [main]

# Only one run per branch; a new push cancels the old one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never let a CI runner phone home for telemetry during a supply-chain-sensitive install.
  DO_NOT_TRACK: '1'

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          # Version comes from the `packageManager` field — single source of truth.
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile is the whole point: CI installs exactly what was
      # reviewed. A PR that changes the lockfile without changing a
      # package.json fails here.
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Verify supply-chain settings were not weakened
        run: node scripts/verify-supply-chain.mjs

      - name: Lint, typecheck, unit + workerd tests
        run: pnpm check

  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails the build on high/critical advisories (TECH_STACK.md).
      - run: pnpm audit --audit-level high

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @scorched/e2e exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  deploy:
    name: Deploy
    needs: [check, audit, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Build the client BEFORE deploying: wrangler.jsonc serves
      # `../client/dist` as static assets, so deploying without this ships a
      # Worker with no game attached to it.
      - run: pnpm build

      # Deployed with the workspace's own pinned wrangler rather than with
      # cloudflare/wrangler-action. The action installs a wrangler of its own
      # choosing, which would sidestep the exact-version pinning and the 7-day
      # quarantine that the rest of this repo is strict about — and it is one
      # more thing that can drift. `pnpm exec` uses the version in the lockfile,
      # which is the same one every test ran against.
      - name: Deploy to Cloudflare
        run: pnpm --filter @scorched/server exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Only needed if the token can see more than one account. Harmless
          # when unset, and a clear error rather than a wrong guess when it is
          # needed and missing.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
