packages:
  - 'packages/*'
  - 'apps/*'
  - 'e2e'

# ---------------------------------------------------------------------------
# Supply-chain security — NON-NEGOTIABLE (see TECH_STACK.md).
#
# No agent may weaken, bypass, or remove these settings. In particular:
#   * never set `minimumReleaseAge: 0` (or lower it),
#   * never use `dangerouslyAllowAllBuilds`,
#   * never install with lifecycle scripts globally enabled.
# If a needed package version is still inside the quarantine window, pick an
# older version or wait the window out. That is the whole point.
# ---------------------------------------------------------------------------

# 7 days, in minutes. Newly published versions are quarantined for a week
# before pnpm will install them. Compromised releases are almost always
# yanked within days, so this is the single highest-value defence.
minimumReleaseAge: 10080

# Transitive deps must resolve from the registry — no git URLs or tarball
# URLs smuggled in through a sub-dependency.
blockExoticSubdeps: true

# Refuse packages whose trust level dropped compared to the prior release.
trustPolicy: no-downgrade

# Lifecycle scripts are blocked by default (pnpm 10+). Only the explicitly
# reviewed few below may run install scripts. Reviewed one by one:
#
#   esbuild  — links the prebuilt platform binary it ships with. Needed by both
#              wrangler and vite; without it neither can bundle.
#   workerd  — the actual Cloudflare Workers runtime binary. `wrangler dev`
#              cannot start without it, so there is no local dev and no
#              vitest-pool-workers test run without this script.
#
# Everything else stays blocked. Playwright downloads Chromium through an
# explicit `playwright install` command, not an install script, so it needs no
# entry here. Adding a name below requires the same scrutiny as adding a
# dependency, and scripts/verify-supply-chain.mjs will reject anything that is
# not also on its reviewed allowlist.
onlyBuiltDependencies:
  - esbuild
  - workerd

allowBuilds:
  esbuild: true
  workerd: true

# ---------------------------------------------------------------------------
# Transitive versions raised to clear a security advisory.
#
# These are the ONLY sanctioned way to answer `pnpm audit` in this repo. The
# alternative — an ignore list, or auditing `--prod` only — would make the
# warning go away without making the machine safer, and both packages below run
# on developer laptops and CI runners, which is exactly where a compromised
# build dependency does its damage. That the deployed Worker does not contain
# them is not the point.
#
# Each entry names the vulnerable RANGE on the left, so only the versions that
# are actually affected get moved and nothing else in the tree is disturbed.
# Each right-hand side is an exact pin that is already past the 7-day
# quarantine — the guard above is not bent to accommodate a fix.
#
# Before adding an entry, check whether UPGRADING would do the job instead: an
# override is a version this repo now owns and has to remember to drop, and a
# dependency that has already fixed itself upstream is strictly better. Both
# entries below were checked that way, and they are NOT the same case — the
# distinction matters for knowing when each can go.
overrides:
  # GHSA-2v37-7h3g-55p8 — custom generators can loop forever at size zero.
  # Reaches us through vite -> postcss -> nanoid, i.e. the client build.
  #
  # NOT a range problem. postcss asks for `nanoid: ^3.3.16`, which already
  # allows the patched 3.3.17, and we are on the newest postcss there is. What
  # pins it is the LOCKFILE, and pnpm offers no surgical way to move a package
  # nothing in this workspace declares: with the override removed, both a plain
  # `pnpm install` and `pnpm update nanoid -r --depth Infinity` leave 3.3.16 in
  # place and the advisory comes straight back. The only alternative is deleting
  # the lockfile and re-resolving the whole tree, which is a far bigger change
  # than the one patch bump being asked for.
  #
  # So this one becomes removable as soon as anything causes a legitimate
  # re-resolution of postcss's subtree. Check with `pnpm why nanoid`.
  'nanoid@<3.3.17': 3.3.17

  # GHSA-4cwx-7wf7-3272 — cross-user information disclosure and a parse-time
  # crash via degenerate private cache directives. Reaches us through
  # miniflare, i.e. `wrangler dev` and the in-workerd test runner.
  #
  # Genuinely forced, and no upgrade at any level helps. miniflare pins
  # `undici: 7.28.0` EXACTLY rather than by range, and every miniflare published
  # in the 90 days to 2026-08-11 does the same — the newest 5.x alpha and the
  # whole 4.x line alike. No version of wrangler or @cloudflare/vitest-pool-
  # workers reaches a patched undici, because there is not one to reach.
  #
  # So this one waits on Cloudflare. Re-check with:
  #   npm view miniflare@latest dependencies.undici
  'undici@<7.29.0': 7.29.0
